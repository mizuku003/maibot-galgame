[plugin]
enabled = true
config_version = "1.0.0"

[source]
ymgal_enabled = true
vndb_enabled = true
egs_enabled = true
timeout = 15
user_agent = "maibot-galgame/1.0.0 (https://github.com/mizuku003/maibot-galgame)"
proxy = ""
ymgal_client_id = "ymgal"
ymgal_client_secret = "luna0327"

[egs]
auto_build = true
refresh_days = 30
min_votes = 5
max_pages = 200
update_pages = 30
scan_pages = 5
delay_seconds = 1.2
match_threshold = 72
fetch_detail = true
max_reviews = 3
fetch_long_reviews = true
max_long_reviews = 2
long_review_chars = 600
proxy = ""

[recommend]
default_count = 5
min_vndb_rating = 0.0
min_vndb_votes = 0
exclude_restricted = false
prefer_chinese = true

[output]
send_card = true
card_width = 830
max_tags = 12
accent_color = "#c2355f"
show_egs_distribution = false
show_reviews = true
hide_adult_pov = false

[review]
enabled = true
persona = "懂 galgame 的老玩家"
prompt = "你在一个 galgame 群里，人设是{persona}。群友刚问起下面这作，你顺手说两句自己的看法 —— 这就是「锐评」。\n写法要求：\n1. 只准用素材里的事实。素材里没有的（销量、staff、续作、剧情细节）一律不许编；\n2. 像在群里打字，不像写评测。开头别寒暄、别先报参数，第一句就要有观点；\n3. 别写成「优点 + 缺点 + 总结」的模板，也别分点、别用 markdown 标题或加粗；\n4. 要具体：说清是哪一段 / 哪个机制 / 哪种走向让你觉得爽或者烦 ——「中盘开始日常变得又长又平」比「节奏一般」有用得多；\n5. 【长文感想】是别的玩家的原话，可以顺着他们的观点说，但别整句照抄，也别复述标了剧透的剧情；\n6. 口语优先：可以用「说实话」「讲真」这种词，但**不要**出现「总的来说」「综上所述」「值得一提」「无论是…还是…」「堪称」「不得不说」「作为一款…」「本作」这类书面语，也不要自称 AI、不要提「资料显示」；\n7. 全篇 {max_chars} 字以内。可以分成 2~4 段短话（像连着发出去的好几条消息，段与段之间空一行），也可以一段说完；\n8. 资料太少就直说「这作资料不多」，然后只讲你确实能讲的；\n9. 末尾会附一段参考资料，那是给你看的 —— 别把它的标题、字段名、「素材」「资料」这类词写进正文，也别整段照抄。\n"
max_chars = 300
model_task = ""

[style]
enabled = false
inject_expressions = false
inject_jargons = false
forums = [
    "galgame",
    "galgame笑话",
]
clean_on_disable = true
chat_ids = []
auto_learn = false
interval_hours = 24
list_pages = 4
posts_per_forum = 50
target_phrases = 50
tag_forum = true
min_replies = 10
max_replies = 2000
max_floors = 30
reply_min_chars = 4
reply_max_chars = 200
delay_seconds = 3.0
proxy = ""

[news]
enabled = true
sources = [
    "bugbug",
    "dgame",
    "ymgal",
]
translate = true
upcoming_days = 90
per_source = 6
max_items = 12
summary_chars = 90
detail_full = true
detail_chars = 3000
cache_minutes = 15
